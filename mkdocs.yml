site_name: Python · Apuntes
site_description: Apuntes de Python siguiendo la estructura de la UD 1 (primer programa).
site_url: https://dopemmanuel.github.io/python-apuntes/
repo_url: https://github.com/dopemmanuel/python-apuntes
repo_name: GitHub
theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css
extra_javascript:
  - assets/lenguajes.js
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Inicio: index.md
  - "U1: Primer programa en Python":
      - u01/index.md
      - "1.1 Un programa": u01/01-programa.md
      - "1.2 Práctica con el lenguaje": u01/02-lenguaje.md
      - "1.3 Tipos de datos": u01/03-tipos.md
      - "1.4 Pruebas con pytest": u01/04-pruebas.md
      - "1.5 Entorno: Python, venv y pip": u01/05-entorno.md
      - "1.6 Bucles: for y while": u01/06-bucles.md
      - "Prácticas": u01/practicas.md
  - Ejercicios de Programación:
      - ejercicios/index.md
      - "P1.2 Primeros programas": ejercicios/p1-2.md
      - "P2.1 Condicionales": ejercicios/p2-1.md
      - "P2.2 Bucles": ejercicios/p2-2.md
      - "P2.3 Excepciones": ejercicios/p2-3.md
      - "P2.4 Depurar": ejercicios/p2-4.md
